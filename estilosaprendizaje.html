<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico VAK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Karla:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F5FB; --surface:#FFFFFF; --surface-2:#EEF1FA; --line:#DCE1F0;
    --ink:#1B2036; --muted:#5B6178; --brand:#4338CA; --brand-ink:#FFFFFF;
    --visual:#3E63FF; --auditivo:#DE7A12; --kinestesico:#0E9A5D;
    --visual-soft:#E7ECFF; --auditivo-soft:#FFEEDC; --kinestesico-soft:#DFF7EA;
    --danger:#C22F41; --shadow:0 1px 2px rgba(27,32,54,.06),0 10px 26px -14px rgba(27,32,54,.22);
    --radius:18px; --radius-sm:11px;
    --font-display:'Baloo 2',ui-rounded,system-ui,sans-serif;
    --font-body:'Karla',system-ui,-apple-system,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12141F; --surface:#1B1E2E; --surface-2:#232739; --line:#2E3348;
      --ink:#EDEFF7; --muted:#A2A8C6; --brand:#9385FF; --brand-ink:#14162A;
      --visual:#7C9CFF; --auditivo:#FFA85C; --kinestesico:#3ED98A;
      --visual-soft:#232B4A; --auditivo-soft:#3A2C1E; --kinestesico-soft:#153327;
      --danger:#FF6B7A; --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 30px -16px rgba(0,0,0,.65);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12141F; --surface:#1B1E2E; --surface-2:#232739; --line:#2E3348;
    --ink:#EDEFF7; --muted:#A2A8C6; --brand:#9385FF; --brand-ink:#14162A;
    --visual:#7C9CFF; --auditivo:#FFA85C; --kinestesico:#3ED98A;
    --visual-soft:#232B4A; --auditivo-soft:#3A2C1E; --kinestesico-soft:#153327;
    --danger:#FF6B7A; --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 30px -16px rgba(0,0,0,.65);
  }
  *{box-sizing:border-box;}
  html{color-scheme:light dark;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:var(--font-body); line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:var(--font-display); font-weight:700; text-wrap:balance; letter-spacing:.2px;}
  .shell{max-width:640px; margin:0 auto; padding:28px 20px 64px;}
  .shell.wide{max-width:980px;}
  header.top{display:flex; align-items:center; gap:12px; padding:18px 20px; border-bottom:1px solid var(--line); background:var(--surface);}
  header.top .mark{font-size:26px; line-height:1;}
  header.top .titles{display:flex; flex-direction:column; gap:1px;}
  header.top .titles .t1{font-family:var(--font-display); font-weight:700; font-size:15px;}
  header.top .titles .t2{font-size:12px; color:var(--muted);}
  header.top .spacer{flex:1;}
  .linkbtn{background:none; border:none; color:var(--brand); font-family:var(--font-body); font-weight:700; font-size:13px; cursor:pointer; padding:6px 8px; border-radius:8px;}
  .linkbtn:hover{background:var(--surface-2);}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:26px;}
  .stack{display:flex; flex-direction:column; gap:16px;}
  .row{display:flex; gap:12px; flex-wrap:wrap;}
  p.lead{color:var(--muted); font-size:15px;}
  .btn{
    font-family:var(--font-body); font-weight:700; font-size:15px; border-radius:var(--radius-sm);
    padding:13px 20px; border:1px solid var(--line); background:var(--surface); color:var(--ink);
    cursor:pointer; transition:transform .08s ease, background .15s ease; text-align:center;
  }
  .btn:hover{background:var(--surface-2);}
  .btn:active{transform:scale(.98);}
  .btn:focus-visible{outline:3px solid var(--brand); outline-offset:2px;}
  .btn-primary{background:var(--brand); color:var(--brand-ink); border-color:var(--brand);}
  .btn-danger{background:#c0392b; color:#fff; border-color:#c0392b;}
  .solo-impresion{display:none;}
  @media print {
    .no-print{display:none !important;}
    .solo-impresion{display:block !important;}
    body{background:#fff;}
  }
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-primary:disabled{opacity:.55; cursor:not-allowed;}
  .btn-sm{padding:8px 14px; font-size:13px;}
  .btn-block{width:100%;}
  .choice-card{
    display:block; width:100%; text-align:left; padding:18px 18px; border-radius:var(--radius-sm);
    border:1.5px solid var(--line); background:var(--surface); cursor:pointer; font-family:var(--font-body);
    font-size:15.5px; color:var(--ink); transition:border-color .12s ease, background .12s ease;
  }
  .choice-card:hover{border-color:var(--brand); background:var(--surface-2);}
  .choice-card:focus-visible{outline:3px solid var(--brand); outline-offset:2px;}
  .role-card{
    display:flex; flex-direction:column; gap:8px; padding:26px 22px; border-radius:var(--radius);
    border:1.5px solid var(--line); background:var(--surface); cursor:pointer; text-align:left; flex:1 1 220px;
    box-shadow:var(--shadow);
  }
  .role-card:hover{border-color:var(--brand);}
  .role-card .emoji{font-size:30px;}
  .role-card h3{margin:0; font-size:19px;}
  .role-card p{margin:0; color:var(--muted); font-size:14px;}
  label{font-size:13px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px;}
  input[type=text],select{
    width:100%; font-family:var(--font-body); font-size:16px; padding:12px 14px; border-radius:var(--radius-sm);
    border:1.5px solid var(--line); background:var(--surface); color:var(--ink); margin-top:6px;
  }
  input[type=text]:focus,select:focus{outline:3px solid var(--brand); outline-offset:1px; border-color:var(--brand);}
  .field{display:flex; flex-direction:column;}
  .progress-wrap{display:flex; align-items:center; gap:10px; margin-bottom:22px;}
  .progress-track{flex:1; height:9px; border-radius:99px; background:var(--surface-2); overflow:hidden;}
  .progress-fill{height:100%; background:var(--brand); border-radius:99px; transition:width .25s ease;}
  .progress-label{font-size:12.5px; color:var(--muted); font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums;}
  .qnum{font-size:12.5px; font-weight:800; color:var(--brand); text-transform:uppercase; letter-spacing:.6px; margin-bottom:6px;}
  .qtext{font-family:var(--font-display); font-size:20px; margin:0 0 18px;}
  .bar-row{display:flex; align-items:center; gap:10px; margin:10px 0;}
  .bar-row .lbl{width:96px; font-size:13px; font-weight:700; flex-shrink:0;}
  .bar-row .pct{width:44px; text-align:right; font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; flex-shrink:0;}
  .bar-track{flex:1; height:14px; border-radius:99px; background:var(--surface-2); overflow:hidden;}
  .bar-fill{height:100%; border-radius:99px;}
  .fill-v{background:var(--visual);} .fill-a{background:var(--auditivo);} .fill-k{background:var(--kinestesico);}
  .badge{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:99px; font-size:12.5px; font-weight:800;}
  .badge-v{background:var(--visual-soft); color:var(--visual);}
  .badge-a{background:var(--auditivo-soft); color:var(--auditivo);}
  .badge-k{background:var(--kinestesico-soft); color:var(--kinestesico);}
  .badge-m{background:var(--surface-2); color:var(--muted);}
  .result-hero{text-align:center; padding:8px 0 4px;}
  .result-hero .emoji{font-size:48px;}
  .result-hero h2{margin:8px 0 4px; font-size:26px;}
  .tips{margin:14px 0 0; padding-left:20px; color:var(--ink); font-size:14.5px;}
  .tips li{margin-bottom:6px;}
  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px;}
  .stat-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:16px; box-shadow:var(--shadow);}
  .stat-card .num{font-family:var(--font-display); font-size:28px; font-variant-numeric:tabular-nums;}
  .stat-card .cap{font-size:12.5px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.3px;}
  table{width:100%; border-collapse:collapse; font-size:14px;}
  th,td{text-align:left; padding:10px 8px; border-bottom:1px solid var(--line);}
  th{font-size:11.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); font-weight:800;}
  .table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius-sm);}
  .table-wrap table{min-width:520px;}
  details.item-detail{border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px 14px; margin-bottom:8px; background:var(--surface);}
  details.item-detail summary{cursor:pointer; font-weight:700; font-size:13.5px; padding:4px 0;}
  textarea.copybox{width:100%; min-height:140px; font-family:ui-monospace,'JetBrains Mono',monospace; font-size:12px; padding:12px; border-radius:var(--radius-sm); border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); resize:vertical;}
  .msg{padding:12px 14px; border-radius:var(--radius-sm); font-size:13.5px; font-weight:600;}
  .msg-error{background:var(--auditivo-soft); color:var(--danger); border:1px solid var(--danger);}
  .msg-ok{background:var(--kinestesico-soft); color:var(--kinestesico); border:1px solid var(--kinestesico);}
  .muted{color:var(--muted);}
  .filters{display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-bottom:18px;}
  .filters .field{min-width:140px;}
  .center{text-align:center;}
  .spin{width:16px; height:16px; border-radius:50%; border:2.5px solid rgba(255,255,255,.4); border-top-color:currentColor; display:inline-block; animation:spin .7s linear infinite; vertical-align:-3px; margin-right:6px;}
  .spin-ink{border:2.5px solid var(--line); border-top-color:var(--brand);}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important;} }
  footer.foot{text-align:center; color:var(--muted); font-size:12px; padding:30px 20px 10px;}
</style>
</head>
<body><script>(function(){
  'use strict';

  // ── Conexión a la Hoja de Google (mismo mecanismo que Control Escolar) ──
  // Pega aquí la URL de tu Web App de Apps Script (termina en /exec).
  var SHEETS_URL = 'https://script.google.com/macros/s/AKfycbzyP65kGWIq6Ury8VO7eLpAa4q9v91kDUL1gcw0fX4-aMuiEYqaurAIbz3J6R9oKj1sHA/exec';
  var CLAVE_PREFIJO = 'vak:'; // cada resultado se guarda como fila "vak:<id>"

  var TEACHER_CODE = 'AMADO2026';

  var QUESTIONS = [
    {v:'Veo dibujos, esquemas o el tema escrito en el pizarrón.', a:'Escucho la explicación con atención, aunque no haya nada escrito.', k:'Hago un ejercicio o práctica relacionada mientras el profesor explica.', ctx:'Cuando el profesor explica un tema nuevo, aprendo mejor si…'},
    {v:'Veo un mapa o las calles anotadas.', a:'Alguien me dice las indicaciones en voz alta.', k:'Camino el trayecto una vez para memorizarlo.', ctx:'Para llegar a un lugar nuevo, prefiero…'},
    {v:'Subrayar, hacer resúmenes o mapas mentales.', a:'Leer el material en voz alta o repetírmelo.', k:'Caminar mientras repaso o escribirlo varias veces.', ctx:'Cuando estudio para un examen, me funciona mejor…'},
    {v:'Ver el instructivo con dibujos paso a paso.', a:'Que alguien me explique cómo hacerlo.', k:'Empezar a probar y ajustar sobre la marcha.', ctx:'Si tengo que armar algo nuevo, prefiero…'},
    {v:'Ver videos, dibujar o leer historietas.', a:'Escuchar música, pódcast o platicar con alguien.', k:'Hacer deporte, bailar o hacer manualidades.', ctx:'En mi tiempo libre, prefiero…'},
    {v:'Verlo escrito con el procedimiento paso a paso.', a:'Que me lo expliquen hablando, sin necesidad de verlo escrito.', k:'Resolverlo yo mismo con ejemplos concretos u objetos.', ctx:'Cuando alguien me explica un problema de matemáticas, entiendo mejor si…'},
    {v:'Leer la letra mientras la escucho.', a:'Escucharla varias veces sin verla escrita.', k:'Moverme, bailar o llevar el ritmo con el cuerpo.', ctx:'Para aprenderme una canción o un poema, prefiero…'},
    {v:'Organizar la información en un cartel, diagrama o presentación.', a:'Ser quien explica las ideas en voz alta al equipo.', k:'Ser quien arma, construye o hace la parte práctica.', ctx:'Cuando trabajo en equipo, me gusta más…'},
    {v:'Buscar un video o imagen que lo explique.', a:'Preguntarle a alguien y que me lo explique hablando.', k:'Intentar resolverlo por mi cuenta hasta entenderlo.', ctx:'Si tengo dudas sobre un tema, prefiero…'},
    {v:'Hay algo escrito o dibujado que puedo ver.', a:'El profesor habla de forma clara e interesante.', k:'Puedo participar, moverme o hacer algo con las manos.', ctx:'En clase, me distraigo menos cuando…'},
    {v:'Escribirla y verla en tarjetas o en una hoja.', a:'Repetirla en voz alta varias veces.', k:'Asociarla con movimientos o repetirla mientras camino.', ctx:'Para memorizar una lista (fechas, nombres, fórmulas), prefiero…'},
    {v:'El texto tiene imágenes, tablas o subrayados.', a:'Lo leo en voz alta o alguien me lo lee.', k:'Voy tomando notas o subrayando mientras leo.', ctx:'Cuando leo un texto, entiendo mejor si…'},
    {v:'Llevo diapositivas, carteles o dibujos de apoyo.', a:'Practico diciendo el tema en voz alta varias veces.', k:'Puedo moverme, usar objetos o hacer una demostración.', ctx:'Si tengo que dar una exposición, me siento más seguro si…'},
    {v:'Ver videos o imágenes explicativas.', a:'Escuchar audios o explicaciones habladas.', k:'Practicar directamente con la aplicación o el juego.', ctx:'Cuando uso una computadora o celular para aprender, prefiero…'},
    {v:'Leer los pasos escritos con fotos.', a:'Que alguien me la explique mientras cocino.', k:'Cocinar guiándome por lo que ya sé y ajustar al probar.', ctx:'Para seguir una receta de cocina, prefiero…'},
    {v:'Ver a alguien hacerlo primero.', a:'Que me expliquen los pasos en voz alta.', k:'Intentarlo yo mismo varias veces.', ctx:'En Educación Física, aprendo un movimiento nuevo más rápido si…'},
    {v:'Pongo más atención a lo que está escrito.', a:'Pongo más atención a lo que está diciendo.', k:'Prefiero copiarlo para procesarlo mientras escribo.', ctx:'Cuando el maestro escribe en el pizarrón mientras habla, yo…'},
    {v:'Que me lo dibujen o muestren por escrito.', a:'Que me lo repitan hablando más despacio.', k:'Que me dejen intentarlo yo con un ejemplo.', ctx:'Si me pierdo explicando algo, me ayuda más…'},
    {v:'Verlo escrito, con dibujos o tarjetas.', a:'Escucharlo y repetirlo en voz alta.', k:'Usarlo en oraciones o actividades prácticas.', ctx:'Para aprender vocabulario nuevo (español o inglés), prefiero…'},
    {v:'Cómo se veía el salón o las imágenes de ese momento.', a:'Lo que se decía o la música que sonaba.', k:'Lo que estábamos haciendo o cómo me sentía moviéndome.', ctx:'Cuando pienso en un recuerdo escolar bonito, recuerdo más…'},
    {v:'Seguir un diagrama con los pasos ilustrados.', a:'Que me expliquen el procedimiento en voz alta.', k:'Manipular los materiales y descubrir cómo funciona.', ctx:'Si tengo que armar un experimento de ciencias, prefiero…'},
    {v:'Que me lo escriban o me lo muestren con una señal.', a:'Que me lo digan directamente.', k:'Que me lo demuestren con un gesto o una acción.', ctx:'Cuando alguien me felicita o me llama la atención, prefiero que…'},
    {v:'Analizarlo viéndolo con calma.', a:'Que alguien me lo explique en voz alta.', k:'Dibujarlo o reproducirlo yo mismo.', ctx:'Para entender un mapa o una gráfica, prefiero…'},
    {v:'Puedo imaginarlo o dibujarlo en mi mente.', a:'Puedo explicarlo hablando sin problema.', k:'Puedo hacerlo o aplicarlo yo mismo.', ctx:'Cuando termino de aprender algo nuevo, sé que lo entendí porque…'}
  ];

  var STYLE_INFO = {
    v:{code:'v', name:'Visual', emoji:'👀', color:'var(--visual)', badge:'badge-v', fill:'fill-v',
       desc:'Aprendes mejor cuando puedes VER la información: dibujos, colores, mapas, videos y texto bien organizado. Observar un ejemplo antes de hacer algo nuevo te ayuda mucho.',
       tips:['Usa colores para organizar tus apuntes y resaltar lo importante.','Convierte la información en dibujos, esquemas o mapas mentales.','Observa un ejemplo o demostración antes de empezar una tarea.']},
    a:{code:'a', name:'Auditivo', emoji:'🎧', color:'var(--auditivo)', badge:'badge-a', fill:'fill-a',
       desc:'Aprendes mejor ESCUCHANDO: explicaciones habladas, conversaciones, música y repetir en voz alta. Explicarle a alguien lo que aprendiste te ayuda a fijarlo.',
       tips:['Repite en voz alta lo que quieres recordar.','Explícale el tema a un compañero o a ti mismo en voz alta.','Participa en conversaciones o debates sobre lo que estás aprendiendo.']},
    k:{code:'k', name:'Kinestésico', emoji:'🤸', color:'var(--kinestesico)', badge:'badge-k', fill:'fill-k',
       desc:'Aprendes mejor HACIENDO: practicando, moviéndote, tocando y experimentando. Necesitas poner las manos en la tarea para que la información se quede contigo.',
       tips:['Practica con ejemplos reales o materiales que puedas manipular.','Toma pausas cortas para moverte mientras estudias.','Actúa o representa físicamente lo que estás aprendiendo.']}
  };

  // ── Capa de datos: Google Sheets vía Apps Script (fetch a /exec) ──

  function sheetsConfigured(){ return /^https:\/\/.+\/exec$/.test(SHEETS_URL); }

  function sheetsRequest(params, method){
    return new Promise(function(resolve){
      if (!sheetsConfigured()){ resolve({ok:false, reason:'not_configured'}); return; }
      var opts = {method: method || 'GET'};
      var url = SHEETS_URL;
      if (opts.method === 'GET'){
        url += '?' + new URLSearchParams(params).toString();
      } else {
        opts.body = new URLSearchParams(params);
      }
      fetch(url, opts).then(function(r){
        if (!r.ok){ resolve({ok:false, reason:'http_' + r.status}); return; }
        r.json().then(function(j){ resolve(j); }).catch(function(){ resolve({ok:false, reason:'bad_json'}); });
      }).catch(function(err){ resolve({ok:false, reason:'network', message: err && err.message}); });
    });
  }

  function newRecordKey(){
    return CLAVE_PREFIJO + Date.now() + '-' + Math.random().toString(36).slice(2,8);
  }

  // Guarda con una clave FIJA por intento: si el primer envío falla (sin
  // internet, error del servidor) y el alumno reintenta, se reenvía el
  // mismo renglón (la acción "set" del script sobrescribe por clave) en vez
  // de crear uno nuevo — así nunca se duplica ni se pierde un resultado.
  function saveRecord(record, key){
    var value = JSON.stringify(record);
    return sheetsRequest({action:'set', key:key, value:value}, 'POST');
  }

  var PENDING_KEY = 'van_pending_result';

  function savePending(key, record){
    try{ localStorage.setItem(PENDING_KEY, JSON.stringify({key:key, record:record})); }catch(e){}
  }
  function clearPending(){
    try{ localStorage.removeItem(PENDING_KEY); }catch(e){}
  }
  function getPending(){
    try{
      var raw = localStorage.getItem(PENDING_KEY);
      if (!raw) return null;
      var p = JSON.parse(raw);
      if (p && p.key && p.record) return p;
    }catch(e){}
    return null;
  }

  function deleteRecord(key){
    return sheetsRequest({action:'borrar', key:key}, 'POST');
  }

  // Para ordenar por apellido paterno como las listas oficiales de SEP.
  // Registros viejos (solo "nombre" libre, antes de este cambio) usan ese
  // texto completo como respaldo para no desaparecer de la lista.
  function claveOrden(s){
    if (s.apellidoPaterno) return [s.apellidoPaterno, s.apellidoMaterno||'', s.nombres||''].join(' ').toLowerCase();
    return String(s.nombre||'').toLowerCase();
  }
  function nombreListaOficial(s){
    if (s.apellidoPaterno) return [s.apellidoPaterno, s.apellidoMaterno, s.nombres].filter(Boolean).join(' ');
    return s.nombre || '';
  }

  function loadRecords(){
    return sheetsRequest({action:'listar', prefijo: CLAVE_PREFIJO}, 'GET').then(function(res){
      if (!res || res.ok !== true) return res;
      var records = [];
      (res.filas || []).forEach(function(row){
        try{
          var rec = JSON.parse(row.valor);
          rec._key = row.clave;
          records.push(rec);
        }catch(e){ /* fila dañada: se ignora */ }
      });
      return {ok:true, records: records};
    });
  }

  function errorText(res){
    if (!res) return 'No se pudo completar la operación. Intenta de nuevo.';
    if (res.reason === 'not_configured') return 'Esta herramienta todavía no está conectada a la Hoja de Google.';
    if (res.reason === 'network') return 'No se pudo conectar a internet. Revisa tu conexión e intenta de nuevo.';
    if (res.reason && String(res.reason).indexOf('http_') === 0) return 'El servidor de la Hoja respondió con un error (' + res.reason.replace('http_','') + '). Intenta de nuevo en un momento.';
    if (res.reason === 'bad_json') return 'La Hoja respondió de forma inesperada. Intenta de nuevo.';
    if (res.error) return 'Error: ' + res.error;
    return 'No se pudo completar la operación. Intenta de nuevo.';
  }

  // ── Estado y utilidades ──

  var state = {students: []};
  var view = {screen:'home', grado:'1', grupo:'', apellidoPaterno:'', apellidoMaterno:'', nombres:'', qi:0, answers:[], savedSummary:null,
              teacherAuth:false, teacherErr:'', filterGrado:'todos', filterGrupo:'',
              dashLoading:false, dashError:null, lastLoaded:null, editingKey:null, confirmDeleteKey:null};

  try{
    if (sessionStorage.getItem('van_teacher_auth') === '1') view.teacherAuth = true;
  }catch(e){}

  function esc(s){
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function computeCounts(answers){
    var c = {v:0,a:0,k:0};
    for (var i=0;i<answers.length;i++){ if (c[answers[i]] !== undefined) c[answers[i]]++; }
    return c;
  }

  function dominant(counts){
    var max = Math.max(counts.v, counts.a, counts.k);
    var top = [];
    if (counts.v === max) top.push('v');
    if (counts.a === max) top.push('a');
    if (counts.k === max) top.push('k');
    return top;
  }

  function dominantLabel(top){
    if (top.length === 1) return STYLE_INFO[top[0]].name;
    return 'Mixto (' + top.map(function(t){return STYLE_INFO[t].name;}).join(' / ') + ')';
  }

  function fmtDate(ts){
    try{ var d = new Date(ts); return d.toLocaleDateString('es-MX',{day:'2-digit',month:'2-digit',year:'numeric'}); }
    catch(e){ return ''; }
  }

  function fmtTime(ts){
    try{ var d = new Date(ts); return d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}); }
    catch(e){ return ''; }
  }

  var root;
  function h(html){ var d = document.createElement('div'); d.innerHTML = html; return d; }
  function mount(html){
    // Full re-render on every state change (including each keystroke on a
    // live-filtered field) is simple but destroys and recreates every node,
    // which would silently drop focus and in-flight edits on a text input.
    // So: remember what was focused (by id) and its cursor position, and
    // restore both after the swap.
    var active = document.activeElement;
    var activeId = (active && root.contains(active)) ? active.id : '';
    var selStart = null, selEnd = null;
    if (activeId && 'selectionStart' in active){
      try{ selStart = active.selectionStart; selEnd = active.selectionEnd; }catch(e){}
    }
    root.innerHTML = '';
    root.appendChild(h(html));
    if (activeId){
      var el = root.querySelector('#' + activeId.replace(/[^a-zA-Z0-9_-]/g, ''));
      if (el){
        el.focus();
        if (selStart != null && 'setSelectionRange' in el){
          try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
        }
      }
    }
  }
  function on(sel, evt, fn){ var els = root.querySelectorAll(sel); for(var i=0;i<els.length;i++){ els[i].addEventListener(evt, fn); } }

  function renderHeader(showHome){
    return '<header class="top"><div class="mark">🧠</div><div class="titles"><div class="t1">Diagnóstico VAK</div>' +
      '<div class="t2">Telesecundaria "Amado Nervo"</div></div><div class="spacer"></div>' +
      (showHome ? '<button class="linkbtn" data-nav="home">Inicio</button>' : '') + '</header>';
  }

  function render(){
    if (view.screen === 'home') return renderHome();
    if (view.screen === 'student-info') return renderStudentInfo();
    if (view.screen === 'quiz') return renderQuiz();
    if (view.screen === 'result') return renderResult(computeCounts(view.answers));
    if (view.screen === 'saved') return renderSaved();
    if (view.screen === 'teacher-gate') return renderTeacherGate();
    if (view.screen === 'teacher-dashboard') return renderDashboard();
    return renderHome();
  }

      '<button class="role-card" data-nav="student-info"><span class="emoji">🧑‍🎓</span><h3>Soy alumno o alumna</h3><p>Responde el diagnóstico (dura unos 8 minutos) y descubre tu estilo de aprendizaje.</p></button>' +
      '<button class="role-card" data-nav="teacher-gate"><span class="emoji">🍎</span><h3>Soy docente / director</h3><p>Consulta los resultados del grupo con el código de acceso.</p></button>' +
      '</div></div></div>' +
      '<footer class="foot">Herramienta interna de la Telesecundaria "Amado Nervo" · sin costo</footer>'
    );

      '<div class="row">' +
      '<div class="field" style="flex:1;"><label>Grado</label><select id="f-grado">' +
        ['1','2','3'].map(function(g){ return '<option value="'+g+'"'+(view.grado===g?' selected':'')+'>'+g+'°</option>'; }).join('') +
      '</select></div>' +

    mount(

  function styleBars(counts, total){
    total = total || (counts.v + counts.a + counts.k) || 1;
    function pct(n){ return Math.round((n/total)*100); }
    return '<div class="bar-row"><div class="lbl">👀 Visual</div><div class="bar-track"><div class="bar-fill fill-v" style="width:' + pct(counts.v) + '%"></div></div><div class="pct">' + pct(counts.v) + '%</div></div>' +
      '<div class="bar-row"><div class="lbl">🎧 Auditivo</div><div class="bar-track"><div class="bar-fill fill-a" style="width:' + pct(counts.a) + '%"></div></div><div class="pct">' + pct(counts.a) + '%</div></div>' +
      '<div class="bar-row"><div class="lbl">🤸 Kinestésico</div><div class="bar-track"><div class="bar-fill fill-k" style="width:' + pct(counts.k) + '%"></div></div><div class="pct">' + pct(counts.k) + '%</div></div>';
  }

  function renderResult(counts){
    var top = dominant(counts);
    var label = dominantLabel(top);
    var primary = STYLE_INFO[top[0]];
    var isMixed = top.length > 1;
    var nombreCompleto = [view.apellidoPaterno, view.apellidoMaterno, view.nombres].filter(Boolean).join(' ');
    mount(
      renderHeader(true) +
      '<div class="shell"><div class="card">' +
      '<div class="result-hero"><span class="emoji">' + (isMixed ? '🌈' : primary.emoji) + '</span>' +
      '<h2>' + esc(view.nombres || 'Tu') + (view.nombres ? ',' : '') + ' tu estilo es <span style="color:' + (isMixed?'var(--brand)':primary.color) + '">' + esc(label) + '</span></h2></div>' +
      '<div style="margin:18px 0;">' + styleBars(counts) + '</div>' +
      '<p style="font-size:15px;">' + (isMixed ? 'No tienes un único estilo dominante: combinas dos (o tres) formas de aprender casi por igual. Aprovecha esta ventaja mezclando las técnicas de cada estilo.' : primary.desc) + '</p>' +
      (isMixed ? '' : '<ul class="tips">' + primary.tips.map(function(t){return '<li>'+esc(t)+'</li>';}).join('') + '</ul>') +
      '<div id="save-area" style="margin-top:20px;">' +
      '<button class="btn btn-primary btn-block" id="save-btn">Guardar mi resultado</button>' +
      '<p class="muted" style="font-size:12.5px;margin:10px 0 0;">Tu resultado se guarda para que tu profesor pueda ver el diagnóstico del grupo. No se guarda nada más de ti.</p>' +
      '</div>' +
      '</div></div>'
    );
    if (!view.pendingResultKey) view.pendingResultKey = newRecordKey();
    var btn = root.querySelector('#save-btn');
    btn.addEventListener('click', function(){
      btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Guardando…';
      var record = {
        nombre: nombreCompleto, apellidoPaterno: view.apellidoPaterno, apellidoMaterno: view.apellidoMaterno, nombres: view.nombres,
        grado: view.grado, grupo: view.grupo, ts: Date.now(),
        answers: view.answers.slice(), counts: counts, dominant: top
      };
      // Se guarda primero en este dispositivo con la MISMA clave que se va a
      // usar en la Hoja: si el envío falla y se cierra la página, el próximo
      // intento (o la próxima vez que se abra la página) puede reintentar
      // exactamente el mismo renglón sin duplicarlo.
      savePending(view.pendingResultKey, record);
      saveRecord(record, view.pendingResultKey).then(function(res){
        if (res && res.ok){
          clearPending();
          view.savedSummary = {nombre: nombreCompleto, nombres: view.nombres, counts: counts, label: label, top: top};
          view.screen = 'saved';
          render();
          return;
        }
        btn.disabled = false; btn.innerHTML = 'Guardar mi resultado';
        var area = document.getElementById('save-area');
        if (area) area.insertAdjacentHTML('beforeend', '<div class="msg msg-error" style="margin-top:10px;">' + esc(errorText(res)) + '</div>');
      });
    });
  }

  function enterDashboard(){
    view.screen = 'teacher-dashboard';
    view.dashLoading = true; view.dashError = null;
    render();

      view.dashLoading = false;
      if (!res || res.ok !== true){

        state.students = res.records;
        view.lastLoaded = Date.now();
      }
      render();
    });

  function renderDashboard(){
    if (!view.teacherAuth){ view.screen = 'teacher-gate'; render(); return; }

    if (view.dashLoading){
      mount(
        renderHeader(true) +
        '<div class="shell"><div class="card center" style="padding:50px 26px;">' +
        '<span class="spin spin-ink" style="width:26px;height:26px;"></span>' +
        '<p class="lead" style="margin-top:14px;">Cargando resultados de la Hoja de Google…</p>' +
        '</div></div>'
      );
      return;
    }

    if (view.dashError){
      mount(
        renderHeader(true) +
        '<div class="shell"><div class="card center stack">' +
        '<h2 style="margin:0;">No se pudieron cargar los resultados</h2>' +
        '<div class="msg msg-error">' + esc(view.dashError) + '</div>' +
        '<button class="btn btn-primary" id="retry">Reintentar</button>' +
        '</div></div>'
      );
      root.querySelector('#retry').addEventListener('click', enterDashboard);
      return;
    }

    var students = state.students.filter(function(s){
      if (view.filterGrado !== 'todos' && s.grado !== view.filterGrado) return false;
      if (view.filterGrupo && s.grupo.toLowerCase().indexOf(view.filterGrupo.toLowerCase()) === -1) return false;
      return true;
    });
    var total = students.length;
    var agg = {v:0,a:0,k:0};
    students.forEach(function(s){ agg.v += s.counts.v; agg.a += s.counts.a; agg.k += s.counts.k; });
    var domCounts = {v:0,a:0,k:0,mixto:0};
    students.forEach(function(s){
      var top = s.dominant || dominant(s.counts);
      if (top.length > 1) domCounts.mixto++; else domCounts[top[0]]++;
    });

    var grades = ['1','2','3'];
    var byGrade = grades.map(function(g){
      var gs = students.filter(function(s){return s.grado===g;});
      var c = {v:0,a:0,k:0};
      gs.forEach(function(s){ c.v+=s.counts.v; c.a+=s.counts.a; c.k+=s.counts.k; });
      return {g:g, n:gs.length, counts:c};
    });

    var itemStats = QUESTIONS.map(function(q, idx){
      var c = {v:0,a:0,k:0};
      students.forEach(function(s){ var ans = s.answers && s.answers[idx]; if (ans && c[ans]!==undefined) c[ans]++; });
      return c;
    });

    var rowsPorGrado = grades.map(function(g){
      var enGrado = students.filter(function(s){ return s.grado === g; }).sort(function(x,y){ return claveOrden(x).localeCompare(claveOrden(y), 'es'); });

        var top = s.dominant || dominant(s.counts);

        if (view.editingKey === s._key){
          return '<tr data-key="' + esc(s._key) + '"><td colspan="6" style="padding:10px 8px;">' +

            '<div class="field" style="margin:0;min-width:120px;"><label style="font-size:11px;">Nombre(s)</label><input type="text" class="ed-nombres" value="' + esc(s.nombres||'') + '"></div>' +

              ['1','2','3'].map(function(gg){ return '<option value="'+gg+'"'+(s.grado===gg?' selected':'')+'>'+gg+'°</option>'; }).join('') +
            '</select></div>' +
            '<div class="field" style="margin:0;min-width:70px;"><label style="font-size:11px;">Grupo</label><input type="text" class="ed-grupo" value="' + esc(s.grupo||'') + '"></div>' +
            '<button class="btn btn-primary btn-sm ed-save">Guardar</button>' +
            '<button class="btn btn-sm ed-cancel">Cancelar</button>' +
            '</div></td></tr>';
        }
        if (view.confirmDeleteKey === s._key){
          return '<tr data-key="' + esc(s._key) + '"><td colspan="6" style="padding:10px 8px;">' +
            '<div class="row" style="align-items:center;gap:10px;">' +
            '<span>¿Eliminar el resultado de <strong>' + esc(nombreListaOficial(s)) + '</strong>?</span>' +
            '<button class="btn btn-danger btn-sm del-confirm">Sí, eliminar</button>' +
            '<button class="btn btn-sm del-cancel">Cancelar</button>' +
            '</div></td></tr>';
        }
        return '<tr data-key="' + esc(s._key) + '"><td>' + esc(nombreListaOficial(s)) + '</td><td>' + esc(s.grado) + '°</td><td>' + esc(s.grupo) + '</td>' +
          '<td><span class="badge ' + badgeClass + '">' + esc(dominantLabel(top)) + '</span></td>' +
          '<td style="font-variant-numeric:tabular-nums;">' + s.counts.v + '/' + s.counts.a + '/' + s.counts.k + '</td>' +
          '<td>' + fmtDate(s.ts) + '</td>' +
          '<td style="white-space:nowrap;"><button class="btn btn-sm row-edit">Editar</button> <button class="btn btn-sm row-del">Eliminar</button></td></tr>';
      }).join('');
      return { g: g, n: enGrado.length, filas: filas };
    });

    var rows = rowsPorGrado.map(function(bloque){
      if (bloque.n === 0) return '';
      return '<tr><td colspan="7" style="background:#f4f4f8;font-weight:700;padding:8px;">' + bloque.g + '° grado (' + bloque.n + ')</td></tr>' + bloque.filas;
    }).join('');

    var reporteImprimible = '<div class="solo-impresion">' +
      '<h2 style="margin:0 0 4px;">Diagnóstico VAK — Telesecundaria "Amado Nervo"</h2>' +
      '<p style="font-size:12px;margin:0 0 14px;">Reporte de resultados · ' + esc(fmtDate(Date.now())) + '</p>' +
      grades.map(function(g){
        var enGrado = students.filter(function(s){ return s.grado === g; }).sort(function(x,y){ return claveOrden(x).localeCompare(claveOrden(y), 'es'); });
        if (enGrado.length === 0) return '';
        return '<h3 style="font-size:14px;margin:14px 0 6px;">' + g + '° grado (' + enGrado.length + ')</h3>' +
          '<table style="width:100%;border-collapse:collapse;font-size:12px;">' +

          enGrado.map(function(s){

          }).join('') + '</tbody></table>';
      }).join('') + '</div>';

    var csv = 'nombre,grado,grupo,visual,auditivo,kinestesico,estilo_dominante,fecha\n' + students.map(function(s){
      var top = s.dominant || dominant(s.counts);
      return [nombreListaOficial(s), s.grado+'°', s.grupo, s.counts.v, s.counts.a, s.counts.k, dominantLabel(top), fmtDate(s.ts)]

      '<p class="muted" style="font-size:12px;margin:-8px 0 0;">Actualizado ' + (view.lastLoaded ? ('a las ' + fmtTime(view.lastLoaded)) : '') + ' · los resultados nuevos requieren pulsar "Actualizar"</p>' +

      '<div class="filters">' +
      '<div class="field"><label>Grado</label><select id="fl-grado">' +
        '<option value="todos"' + (view.filterGrado==='todos'?' selected':'') + '>Todos</option>' +
        grades.map(function(g){return '<option value="'+g+'"'+(view.filterGrado===g?' selected':'')+'>'+g+'°</option>';}).join('') +
      '</select></div>' +
      '<div class="field"><label>Grupo (opcional)</label><input type="text" id="fl-grupo" value="' + esc(view.filterGrupo) + '" placeholder="Ej. A"></div>' +
      '</div>' +

      (total === 0 ? '<div class="card center"><p class="lead" style="margin:0;">Todavía no hay resultados' + (view.filterGrado!=='todos'||view.filterGrupo ? ' para este filtro' : '') + '. Comparte el enlace con tus alumnos para que respondan el diagnóstico.</p></div>' :
      '<div class="stat-grid">' +
      '<div class="stat-card"><div class="num">' + total + '</div><div class="cap">Alumnos evaluados</div></div>' +
      '<div class="stat-card"><div class="num" style="color:var(--visual);">' + domCounts.v + '</div><div class="cap">Predominan Visual</div></div>' +
      '<div class="stat-card"><div class="num" style="color:var(--auditivo);">' + domCounts.a + '</div><div class="cap">Predominan Auditivo</div></div>' +
      '<div class="stat-card"><div class="num" style="color:var(--kinestesico);">' + domCounts.k + '</div><div class="cap">Predominan Kinestésico</div></div>' +
      '</div>' +

      '<div class="card"><h3 style="margin:0 0 12px;font-size:16px;">Promedio del grupo</h3>' + styleBars(agg) + '</div>' +

      '<div class="card"><h3 style="margin:0 0 14px;font-size:16px;">Por grado</h3>' +
      byGrade.filter(function(b){return b.n>0;}).map(function(b){
        return '<div style="margin-bottom:14px;"><div style="font-weight:800;font-size:13px;margin-bottom:6px;">' + b.g + '° <span class="muted" style="font-weight:600;">(' + b.n + ' alumnos)</span></div>' + styleBars(b.counts) + '</div>';
      }).join('') + '</div>' +

      '<div class="card"><h3 style="margin:0 0 14px;font-size:16px;">Alumnos</h3>' +
      '<div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Grado</th><th>Grupo</th><th>Estilo</th><th>V/A/K</th><th>Fecha</th><th>Acciones</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>' +

      '<details class="item-detail" style="padding:16px;"><summary>Detalle por situación (para identificar tendencias del grupo)</summary>' +
      '<div style="margin-top:12px;">' + itemStats.map(function(c, idx){
        return '<div style="margin-bottom:12px;"><div class="muted" style="font-size:12.5px;margin-bottom:4px;">' + (idx+1) + '. ' + esc(QUESTIONS[idx].ctx) + '</div>' + styleBars(c) + '</div>';
      }).join('') + '</div></details>' +

      '<div class="card"><h3 style="margin:0 0 10px;font-size:16px;">Copiar datos (para Excel)</h3>' +
      '<p class="muted" style="font-size:12.5px;margin:0 0 8px;">Selecciona el texto y cópialo a una hoja de cálculo si lo necesitas.</p>' +
      '<textarea class="copybox" readonly onclick="this.select()">' + esc(csv) + '</textarea></div>' +
      reporteImprimible
      ) +
      '</div></div>'
    );

    root.querySelector('#t-print').addEventListener('click', function(){ window.print(); });

    root.querySelector('#t-refresh').addEventListener('click', enterDashboard);
    root.querySelector('#t-logout').addEventListener('click', function(){
      view.teacherAuth = false;
      try{ sessionStorage.removeItem('van_teacher_auth'); }catch(e){}
      view.screen = 'home'; render();
    });
    root.querySelector('#fl-grado').addEventListener('change', function(e){ view.filterGrado = e.target.value; render(); });
    var fg = root.querySelector('#fl-grupo');
    fg.addEventListener('input', function(e){ view.filterGrupo = e.target.value; render(); });

    var tableWrap = root.querySelector('.table-wrap');
    if (tableWrap){
      tableWrap.addEventListener('click', function(e){
        var tr = e.target.closest('tr[data-key]');
        if (!tr) return;
        var key = tr.getAttribute('data-key');
        if (e.target.classList.contains('row-edit')){ view.editingKey = key; view.confirmDeleteKey = null; render(); return; }
        if (e.target.classList.contains('row-del')){ view.confirmDeleteKey = key; view.editingKey = null; render(); return; }
        if (e.target.classList.contains('ed-cancel')){ view.editingKey = null; render(); return; }
        if (e.target.classList.contains('del-cancel')){ view.confirmDeleteKey = null; render(); return; }
        if (e.target.classList.contains('del-confirm')){
          e.target.disabled = true; e.target.textContent = 'Eliminando…';
          deleteRecord(key).then(function(res){
            if (res && res.ok){
              state.students = state.students.filter(function(s){ return s._key !== key; });
              view.confirmDeleteKey = null; render();
            } else {
              alert(errorText(res));
              view.confirmDeleteKey = null; render();
            }
          });
          return;
        }
        if (e.target.classList.contains('ed-save')){
          var record = state.students.find(function(s){ return s._key === key; });
          if (!record) return;
          var apellidoPaterno = tr.querySelector('.ed-appat').value.trim();
          var apellidoMaterno = tr.querySelector('.ed-apmat').value.trim();
          var nombres = tr.querySelector('.ed-nombres').value.trim();
          var grado = tr.querySelector('.ed-grado').value;
          var grupo = tr.querySelector('.ed-grupo').value.trim();
          if (!apellidoPaterno || !nombres || !grupo){ alert('Falta el apellido paterno, el nombre o el grupo.'); return; }
          e.target.disabled = true; e.target.textContent = 'Guardando…';
          var nuevoRegistro = Object.assign({}, record, {
            apellidoPaterno: apellidoPaterno, apellidoMaterno: apellidoMaterno, nombres: nombres,
            nombre: [apellidoPaterno, apellidoMaterno, nombres].filter(Boolean).join(' '),
            grado: grado, grupo: grupo
          });
          delete nuevoRegistro._key;
          saveRecord(nuevoRegistro, key).then(function(res){
            if (res && res.ok){
              nuevoRegistro._key = key;
              var idx = state.students.findIndex(function(s){ return s._key === key; });
              if (idx >= 0) state.students[idx] = nuevoRegistro;
              view.editingKey = null; render();
            } else {
              alert(errorText(res));
              e.target.disabled = false; e.target.textContent = 'Guardar';
            }
          });
        }
      });
    }
  }

  function retryPendingIfAny(){
    var p = getPending();
    if (!p) return;
    // Un resultado de una visita anterior no se pudo guardar (se cerró la
    // página sin internet, por ejemplo). Se reintenta en silencio con la
    // MISMA clave — si ya se había guardado del lado del servidor, esto solo
    // sobrescribe el mismo renglón con el mismo contenido, nunca duplica.
    saveRecord(p.record, p.key).then(function(res){
      if (res && res.ok) clearPending();
    });
  }

  function init(){
    root = document.getElementById('root');
    if (!root){ root = document.createElement('div'); root.id = 'root'; document.body.appendChild(root); }
    retryPendingIfAny();
    if (view.teacherAuth){ enterDashboard(); } else { render(); }
  }

  if (document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', init); }
  else { init(); }
})();</script></body></html>
