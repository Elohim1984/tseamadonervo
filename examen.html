portantes fueron la expropiación petrolera y el reparto agrario fue:","opts":["Porfirio Díaz","Lázaro Cárdenas","Benito Juárez","Francisco I. Madero"],"correct":1},{"q":"Los grupos católicos que se levantaron en armas contra el gobierno mexicano en los años veinte se conocían como:","opts":["Agraristas","Constitucionalistas","Cristeros","Federalistas"],"correct":2},{"q":"La palabra \"democracia\" significa:","opts":["Gobierno de unos cuantos","Gobierno o poder del pueblo","Ausencia de gobierno","Gobierno de un solo líder"],"correct":1},{"q":"Cuando las autoridades informan a la ciudadanía sobre sus acciones y el manejo de los recursos públicos, se habla de:","opts":["Impartición de justicia","Rendición de cuentas","Imparcialidad","Soberanía"],"correct":1},{"q":"Los derechos inherentes a todas las personas, sin importar su origen, género o religión, se llaman:","opts":["Derechos humanos","Derechos de autor","Derechos de estado","Derechos civiles exclusivos"],"correct":0},{"q":"Las elecciones son importantes en una democracia porque:","opts":["Permiten a los ciudadanos elegir a sus representantes","Limitan la participación política","Favorecen el mandato indefinido","Reducen el derecho al voto"],"correct":0}]},{"nombre":"De lo Humano y lo Comunitario","reactivos":[{"q":"Los aspectos de la lógica interna de una actividad física son el espacio, el material, el tiempo y:","opts":["El clima","La interacción con otros jugadores","El uniforme","El marcador"],"correct":1},{"q":"Organizar equipos mixtos para que participen todos por igual es una acción que promueve:","opts":["La exclusión","La interacción respetuosa entre compañeros","La competencia desleal","El individualismo"],"correct":1},{"q":"Explicar a los alumnos la distancia y ubicación de cada elemento en una cancha antes de jugar se relaciona con:","opts":["El uso de recursos materiales","El aprovechamiento del espacio","La interacción con compañeros","El manejo del tiempo"],"correct":1},{"q":"Establecer que un part <script id="engine">/* Examen Diagnóstico en línea — Telesecundaria "Amado Nervo"
   Motor de la aplicación. Página 100% estática y autocontenida: NO depende
   de Claude para funcionar ni para guardar datos (igual que Control Escolar).
   El guardado y la lectura de resultados usan el mismo Apps Script /
   Hoja de Google que ya usa Control Escolar, con su propio prefijo de clave
   ("examenDiag:") para no tocar ni pisar los datos de esa herramienta. */

(function () {
  'use strict';

  var TEACHER_CODE = 'AMADO2026';
  var SCHOOL = {
    nombre: 'Telesecundaria "Amado Nervo"',
    comunidad: 'Santa María Xoyatla, municipio de Tepeojuma, Puebla',
    ciclo: '2026-2027'
  };

  /* ---------- conexión a la Hoja de Google (misma que Control Escolar) ---------- */
  var SHEETS_URL = 'https://script.google.com/macros/s/AKfycbzyP65kGWIq6Ury8VO7eLpAa4q9v91kDUL1gcw0fX4-aMuiEYqaurAIbz3J6R9oKj1sHA/exec';
  var KEY_PREFIX = 'examenDiag:';

  /* POST vía application/x-www-form-urlencoded: así el navegador NO manda
     una petición de "preflight" (OPTIONS) — Apps Script no la maneja bien —
     y la escritura llega en un solo viaje, igual que ya lo prueba Control
     Escolar en producción. */
  function sheetsSet(key, valueObj) {
    var body = new URLSearchParams();
    body.set('action', 'set');
    body.set('key', key);
    body.set('value', JSON.stringify(valueObj));
    return fetch(SHEETS_URL, { method: 'POST', body: body }).then(function (r) {
      return r.json();
    });
  }

  function sheetsListar(prefijo) {
    var url = SHEETS_URL + '?action=listar&prefijo=' + encodeURIComponent(prefijo);
    return fetch(url).then(function (r) { return r.json(); });
  }

  var EXAM = JSON.parse(document.getElementById('exam-data').textContent);
  var LETTERS = ['a', 'b', 'c', 'd'];

  /* ---------- estado local de la vista ---------- */
  var ui = {
    screen: 'landing', /* landing | alumno | examen | guardando | confirm | error | teacherGate | teacherPanel */
    grado: null,
    alumno: { nombre: '', grupo: '' },
    respuestas: {},   /* clave "campoIdx_reactivoIdx" -> letra */
    lastError: null,
    lastRecord: null,
    teacherError: null
  };

  /* estado de los resultados del panel docente — vive aparte porque se
     recarga en vivo desde la Hoja (no es parte de la página estática) */
  var teacherData = { loading: false, error: null, subs: [], loadedOnce: false };

  /* ---------- utilidades ---------- */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    attrs = attrs || {};
    for (var k in attrs) {
      if (k === 'class') n.className = attrs[k];
      else if (k === 'html') n.innerHTML = attrs[k];
      else n.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) {
      if (c == null) return;
      n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return n;
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function genId() {
    return 'sub_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function totalReactivos(grado) {
    return EXAM[grado].reduce(function (s, c) { return s + c.reactivos.length; }, 0);
  }

  /* ---------- cálculo de resultados de un envío ---------- */
  function scoreRecord(rec) {
    var campos = EXAM[rec.grado];
    var out = [];
    campos.forEach(function (campo, ci) {
      var aciertos = 0;
      campo.reactivos.forEach(function (r, qi) {
        var given = rec.respuestas[ci + '_' + qi];
        if (given != null && LETTERS[r.correct] === given) aciertos++;
      });
      var n = campo.reactivos.length;
      out.push({ nombre: campo.nombre, aciertos: aciertos, n: n, calif: Math.round((aciertos / n) * 10 * 10) / 10 });
    });
    var promedio = Math.round((out.reduce(function (s, c) { return s + c.calif; }, 0) / out.length) * 10) / 10;
    return { porCampo: out, promedio: promedio };
  }

  /* ---------- guardar el examen del alumno (con reintento) ----------
     Cada envío es un renglón propio en la Hoja (clave = examenDiag:<id
     único>), así que dos alumnos enviando al mismo tiempo NUNCA chocan
     entre sí — cada quien escribe su propio renglón. Si la escritura
     falla (sin internet, Hoja ocupada, etc.) las respuestas del alumno
     siguen guardadas en este dispositivo (localStorage) y "Reintentar"
     vuelve a mandar exactamente el mismo renglón: repetir un "set" con la
     misma clave nunca duplica nada. */
  function draftKey() { return 'diag_draft_v1'; }
  function pendingKey() { return 'diag_pending_v1'; }

  function enviarRecord(record, attempt) {
    attempt = attempt || 0;
    sheetsSet(KEY_PREFIX + record.id, record).then(function (resp) {
      if (!resp || resp.ok !== true) {
        throw new Error((resp && resp.error) || 'Respuesta inesperada del servidor.');
      }
      try { localStorage.removeItem(pendingKey()); } catch (e) {}
      ui.lastRecord = record;
      ui.screen = 'confirm';
      render();
    }).catch(function (err) {
      if (attempt < 3) {
        sleep(700 + Math.random() * 900).then(function () {
          enviarRecord(record, attempt + 1);
        });
        return;
      }
      ui.lastRecord = record;
      ui.screen = 'error';
      ui.lastError = 'No se pudo guardar tu examen en este intento (' + (err && err.message ? err.message : 'sin conexión') + '). Tus respuestas siguen guardadas en este dispositivo — no se perdieron. Revisa tu conexión a internet y toca "Reintentar".';
      render();
    });
  }

  function submitExam() {
    var record = {
      id: genId(),
      grado: ui.grado,
      nombre: ui.alumno.nombre.trim(),
      grupo: ui.alumno.grupo.trim(),
      respuestas: ui.respuestas,
      ts: Date.now()
    };
    try { localStorage.setItem(pendingKey(), JSON.stringify(record)); } catch (e) {}
    try { localStorage.removeItem(draftKey()); } catch (e) {}
    ui.lastRecord = record;
    ui.screen = 'guardando';
    render();
    enviarRecord(record, 0);
  }

  function retryPending() {
    var record = ui.lastRecord;
    if (!record) {
      try {
        var raw = localStorage.getItem(pendingKey());
        if (raw) record = JSON.parse(raw);
      } catch (e) {}
    }
    if (!record) { ui.screen = 'landing'; render(); return; }
    ui.lastRecord = record;
    ui.screen = 'guardando';
    render();
    enviarRecord(record, 0);
  }

  /* ---------- autoguardado local del progreso (solo este dispositivo) ---------- */
  function saveDraft() {
    try {
      localStorage.setItem(draftKey(), JSON.stringify({
        grado: ui.grado, alumno: ui.alumno, respuestas: ui.respuestas, ts: Date.now()
      }));
    } catch (e) {}
  }
  function loadDraft() {
    try {
      var raw = localStorage.getItem(draftKey());
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) { return null; }
  }

  /* ---------- resultados del panel docente (se leen de la Hoja en vivo) ---------- */
  function cargarResultadosDocente() {
    teacherData.loading = true;
    teacherData.error = null;
    render();
    sheetsListar(KEY_PREFIX).then(function (resp) {
      teacherData.loading = false;
      if (!resp || resp.ok !== true) {
        teacherData.error = (resp && resp.error) || 'No se pudo leer la Hoja.';
        render();
        return;
      }
      var subs = [];
      (resp.filas || []).forEach(function (fila) {
        try {
          var rec = JSON.parse(fila.valor);
          if (rec && rec.id && rec.grado && rec.respuestas) subs.push(rec);
        } catch (e) { /* renglón dañado o de otro tipo de dato con el mismo prefijo: se ignora */ }
      });
      teacherData.subs = subs;
      teacherData.loadedOnce = true;
      render();
    }).catch(function (err) {
      teacherData.loading = false;
      teacherData.error = 'No se pudo conectar con la Hoja de Google. Revisa tu conexión a internet e intenta de nuevo.';
      render();
    });
  }

  /* ---------- pantallas ---------- */
  function render() {
    var app = $('#app');
    app.innerHTML = '';
    app.appendChild(buildScreen());
  }

  function buildScreen() {
    if (ui.screen === 'landing') return buildLanding();
    if (ui.screen === 'alumno') return buildAlumno();
    if (ui.screen === 'examen') return buildExamen();
    if (ui.screen === 'guardando') return buildGuardando();
    if (ui.screen === 'confirm') return buildConfirm();
    if (ui.screen === 'error') return buildError();
    if (ui.screen === 'teacherGate') return buildTeacherGate();
    if (ui.screen === 'teacherPanel') return buildTeacherPanel();
    return buildLanding();
  }

  function buildLanding() {
    var wrap = el('div', { class: 'wrap' });
    wrap.appendChild(el('div', { class: 'eyebrow' }, ['Examen diagnóstico · Ciclo ' + SCHOOL.ciclo]));
    wrap.appendChild(el('h1', {}, [SCHOOL.nombre]));
    wrap.appendChild(el('div', { class: 'sub' }, [SCHOOL.comunidad + '. Elige tu grado para comenzar.']));

    var draft = loadDraft();
    if (draft && draft.grado) {
      var card = el('div', { class: 'card' }, [
        el('div', {}, ['Tienes un examen sin terminar de ' + draft.grado + '° (' + (draft.alumno.nombre || 'sin nombre') + ').']),
        el('button', { class: 'btn small', style: 'margin-top:10px;' }, ['Continuar mi examen'])
      ]);
      card.querySelector('button').addEventListener('click', function () {
        ui.grado = draft.grado; ui.alumno = draft.alumno; ui.respuestas = draft.respuestas || {};
        ui.screen = 'examen'; render();
      });
      wrap.appendChild(card);
    }

    var grid = el('div', { class: 'grade-grid' });
    ['1', '2', '3'].forEach(function (g) {
      var btn = el('button', { class: 'grade-card g' + g }, [
        el('div', { class: 'n' }, [g + '°']),
        el('div', { class: 'd' }, [totalReactivos(g) + ' reactivos · 4 campos formativos'])
      ]);
      btn.addEventListener('click', function () {
        ui.grado = g; ui.alumno = { nombre: '', grupo: '' }; ui.respuestas = {};
        ui.screen = 'alumno'; render();
      });
      grid.appendChild(btn);
    });
    wrap.appendChild(grid);

    var teacherBtn = el('button', { class: 'linklike', style: 'margin-top:34px;display:block;' }, ['Acceso docente']);
    teacherBtn.addEventListener('click', function () { ui.screen = 'teacherGate'; ui.teacherError = null; render(); });
    wrap.appendChild(teacherBtn);
    return wrap;
  }

  function buildAlumno() {
    var wrap = el('div', { class: 'wrap' });
    var back = el('button', { class: 'linklike' }, ['← Elegir otro grado']);
    back.addEventListener('click', function () { ui.screen = 'landing'; render(); });
    wrap.appendChild(back);
    wrap.appendChild(el('h1', { style: 'margin-top:14px;' }, ['Examen diagnóstico · ' + ui.grado + '°']));
    wrap.appendChild(el('div', { class: 'sub' }, ['Antes de comenzar, escribe tu nombre completo y tu grupo.']));

    wrap.appendChild(el('label', {}, ['Nombre completo del alumno(a)']));
    var nombreInput = el('input', { type: 'text', id: 'inNombre', value: ui.alumno.nombre, placeholder: 'Ej. Juan Pérez López' });
    wrap.appendChild(nombreInput);

    wrap.appendChild(el('label', {}, ['Grupo']));
    var grupoInput = el('input', { type: 'text', id: 'inGrupo', value: ui.alumno.grupo, placeholder: 'Ej. A' });
    wrap.appendChild(grupoInput);

    var err = el('div', { class: 'errbox', style: 'display:none;' }, ['Escribe tu nombre y tu grupo para continuar.']);
    wrap.appendChild(err);

    var startBtn = el('button', { class: 'btn', style: 'margin-top:20px;' }, ['Comenzar examen']);
    startBtn.addEventListener('click', function () {
      var nombre = nombreInput.value.trim(), grupo = grupoInput.value.trim();
      if (!nombre || !grupo) { err.style.display = 'block'; return; }
      ui.alumno = { nombre: nombre, grupo: grupo };
      ui.screen = 'examen'; render();
    });
    wrap.appendChild(startBtn);
    return wrap;
  }

  function buildExamen() {
    var campos = EXAM[ui.grado];
    var total = totalReactivos(ui.grado);
    var answered = Object.keys(ui.respuestas).length;

    var root = el('div', {});
    var prog = el('div', { class: 'progress' }, [
      el('div', {}, [
        el('span', { style: 'font-size:13px;font-weight:600;' }, [ui.alumno.nombre + ' · ' + ui.grado + '° ' + ui.alumno.grupo]),
        el('span', { style: 'float:right;font-size:13px;color:var(--ink-soft);' }, [answered + ' / ' + total])
      ]),
      el('div', { class: 'bar' }, [el('div', { class: 'fill', style: 'width:' + Math.round((answered / total) * 100) + '%;' })])
    ]);
    var wrap = el('div', { class: 'wrap' });
    wrap.appendChild(prog);

    campos.forEach(function (campo, ci) {
      wrap.appendChild(el('div', { class: 'campo-band' }, [campo.nombre]));
      campo.reactivos.forEach(function (r, qi) {
        var key = ci + '_' + qi;
        var qDiv = el('div', { class: 'q' });
        qDiv.appendChild(el('div', { class: 'qtext' }, [(qi + 1) + '. ' + r.q]));
        r.opts.forEach(function (opt, oi) {
          var letter = LETTERS[oi];
          var id = 'r_' + key + '_' + letter;
          var label = el('label', { class: 'opt', for: id });
          var radio = el('input', { type: 'radio', name: 'q_' + key, id: id, value: letter });
          if (ui.respuestas[key] === letter) radio.checked = true;
          radio.addEventListener('change', function () {
            ui.respuestas[key] = letter;
            saveDraft();
            render();
            var target = document.getElementById(id);
            if (target) target.scrollIntoView({ block: 'center', behavior: 'instant' in window ? 'instant' : 'auto' });
          });
          label.appendChild(radio);
          label.appendChild(document.createTextNode(letter + ') ' + opt));
          qDiv.appendChild(label);
        });
        wrap.appendChild(qDiv);
      });
    });

    var sendWrap = el('div', { style: 'margin-top:24px;' });
    if (answered < total) {
      sendWrap.appendChild(el('div', { class: 'sub' }, ['Te faltan ' + (total - answered) + ' reactivos por contestar. Puedes enviar el examen aunque no lo termines.']));
    }
    var sendBtn = el('button', { class: 'btn' }, ['Enviar examen']);
    sendBtn.addEventListener('click', function () { submitExam(); });
    sendWrap.appendChild(sendBtn);
    wrap.appendChild(sendWrap);

    root.appendChild(wrap);
    return root;
  }

  function buildGuardando() {
    var wrap = el('div', { class: 'wrap' });
    wrap.appendChild(el('h1', {}, ['Guardando tu examen…']));
    wrap.appendChild(el('div', { class: 'sub' }, ['No cierres esta página.']));
    return wrap;
  }

  function buildConfirm() {
    var rec = ui.lastRecord;
    var score = scoreRecord(rec);
    var wrap = el('div', { class: 'wrap' });
    wrap.appendChild(el('h1', {}, ['¡Listo, ' + esc(rec.nombre) + '!']));
    wrap.appendChild(el('div', { class: 'sub' }, ['Tu examen de ' + rec.grado + '° se guardó correctamente. Esto es un diagnóstico, no una calificación reprobatoria.']));

    var table = el('table');
    table.appendChild(el('tr', {}, [el('th', {}, ['Campo formativo']), el('th', {}, ['Aciertos']), el('th', {}, ['Calificación'])]));
    score.porCampo.forEach(function (c) {
      table.appendChild(el('tr', {}, [
        el('td', {}, [c.nombre]),
        el('td', {}, [c.aciertos + ' / ' + c.n]),
        el('td', {}, [String(c.calif)])
      ]));
    });
    table.appendChild(el('tr', {}, [el('td', { html: '<b>Promedio</b>' }), el('td', {}, ['']), el('td', { html: '<b>' + score.promedio + '</b>' })]));
    wrap.appendChild(table);

    var back = el('button', { class: 'btn secondary', style: 'margin-top:18px;' }, ['Volver al inicio']);
    back.addEventListener('click', function () {
      ui.screen = 'landing'; ui.grado = null; ui.alumno = { nombre: '', grupo: '' }; ui.respuestas = {};
      render();
    });
    wrap.appendChild(back);
    return wrap;
  }

  function buildError() {
    var wrap = el('div', { class: 'wrap' });
    wrap.appendChild(el('h1', {}, ['Ocurrió un problema']));
    wrap.appendChild(el('div', { class: 'errbox' }, [ui.lastError || 'Error desconocido.']));
    var retry = el('button', { class: 'btn' }, ['Reintentar']);
    retry.addEventListener('click', function () { retryPending(); });
    wrap.appendChild(retry);
    return wrap;
  }

  function buildTeacherGate() {
    var wrap = el('div', { class: 'wrap' });
    var back = el('button', { class: 'linklike' }, ['← Volver']);
    back.addEventListener('click', function () { ui.screen = 'landing'; render(); });
    wrap.appendChild(back);
    wrap.appendChild(el('h1', { style: 'margin-top:14px;' }, ['Panel del docente']));
    wrap.appendChild(el('label', {}, ['Código de acceso']));
    var codeInput = el('input', { type: 'text', id: 'inCode', placeholder: '••••••••' });
    wrap.appendChild(codeInput);
    if (ui.teacherError) wrap.appendChild(el('div', { class: 'errbox' }, [ui.teacherError]));
    var enterBtn = el('button', { class: 'btn', style: 'margin-top:16px;' }, ['Entrar']);
    enterBtn.addEventListener('click', function () {
      if (codeInput.value === TEACHER_CODE) {
        try { sessionStorage.setItem('diag_teacher_v1', '1'); } catch (e) {}
        ui.screen = 'teacherPanel'; render();
        cargarResultadosDocente();
      } else {
        ui.teacherError = 'Código incorrecto.'; render();
      }
    });
    wrap.appendChild(enterBtn);
    return wrap;
  }

  function semaforo(calif) {
    if (calif == null) return el('span', { class: 'pill' }, ['Sin datos']);
    if (calif < 6) return el('span', { class: 'pill bad' }, ['Reforzar']);
    if (calif < 8) return el('span', { class: 'pill warn' }, ['Regular']);
    return el('span', { class: 'pill good' }, ['Adecuado']);
  }

  function tsvBlock(rows) {
    return rows.map(function (row) { return row.join('\t'); }).join('\n');
  }

  function selectAllBtn(preId) {
    var b = el('button', { class: 'btn small secondary', style: 'margin:6px 0 16px;' }, ['Seleccionar todo']);
    b.addEventListener('click', function () {
      var node = document.getElementById(preId);
      var range = document.createRange();
      range.selectNodeContents(node);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    });
    return b;
  }

  function buildTeacherPanel() {
    var wrap = el('div', { class: 'wrap' });
    var topBar = el('div', {});
    var back = el('button', { class: 'linklike' }, ['← Volver al inicio']);
    back.addEventListener('click', function () { try { sessionStorage.removeItem('diag_teacher_v1'); } catch (e) {} ui.screen = 'landing'; render(); });
    topBar.appendChild(back);
    var refresh = el('button', { class: 'linklike', style: 'margin-left:18px;' }, ['↻ Actualizar resultados']);
    refresh.addEventListener('click', function () { cargarResultadosDocente(); });
    topBar.appendChild(refresh);
    wrap.appendChild(topBar);
    wrap.appendChild(el('h1', { style: 'margin-top:14px;' }, ['Panel del docente']));
    wrap.appendChild(el('div', { class: 'sub' }, [SCHOOL.nombre + ' · Ciclo ' + SCHOOL.ciclo]));

    if (teacherData.loading && !teacherData.loadedOnce) {
      wrap.appendChild(el('div', { class: 'card' }, ['Cargando resultados desde la Hoja de Google…']));
      return wrap;
    }
    if (teacherData.error) {
      wrap.appendChild(el('div', { class: 'errbox' }, [teacherData.error]));
      var retryLoad = el('button', { class: 'btn' }, ['Reintentar']);
      retryLoad.addEventListener('click', function () { cargarResultadosDocente(); });
      wrap.appendChild(retryLoad);
      return wrap;
    }
    if (teacherData.loading) {
      wrap.appendChild(el('div', { class: 'sub' }, ['Actualizando…']));
    }

    var subsAll = teacherData.subs;
    var byGrade = { '1': [], '2': [], '3': [] };
    subsAll.forEach(function (s) { if (byGrade[s.grado]) byGrade[s.grado].push(s); });

    /* --- avance de aplicación --- */
    wrap.appendChild(el('h2', { style: 'margin-top:26px;' }, ['Avance de aplicación']));
    var advTable = el('table');
    advTable.appendChild(el('tr', {}, [el('th', {}, ['Grado']), el('th', {}, ['Alumnos capturados']), el('th', {}, ['Por grupo'])]));
    ['1', '2', '3'].forEach(function (g) {
      var subs = byGrade[g];
      var groups = {};
      subs.forEach(function (s) { var k = s.grupo || 'Sin grupo'; groups[k] = (groups[k] || 0) + 1; });
      var groupTxt = Object.keys(groups).sort().map(function (k) { return k + ': ' + groups[k]; }).join(', ') || '—';
      advTable.appendChild(el('tr', {}, [el('td', {}, [g + '°']), el('td', {}, [String(subs.length)]), el('td', {}, [groupTxt])]));
    });
    wrap.appendChild(advTable);

    var campoAverages = {}; /* campoAverages[g] = [{nombre, avg, n}] */

    ['1', '2', '3'].forEach(function (g) {
      var subs = byGrade[g];
      var campos = EXAM[g];
      var scored = subs.map(scoreRecord);
      var avgs = campos.map(function (campo, ci) {
        var vals = scored.map(function (sc) { return sc.porCampo[ci].calif; });
        var avg = vals.length ? Math.round((vals.reduce(function (a, b) { return a + b; }, 0) / vals.length) * 10) / 10 : null;
        return { nombre: campo.nombre, avg: avg, n: subs.length };
      });
      campoAverages[g] = avgs;

      wrap.appendChild(el('h2', { style: 'margin-top:30px;' }, [g + '° — promedio por campo formativo']));
      var t = el('table');
      t.appendChild(el('tr', {}, [el('th', {}, ['Campo formativo']), el('th', {}, ['Promedio del grupo']), el('th', {}, ['Diagnóstico'])]));
      avgs.forEach(function (a) {
        var row = el('tr', {}, [el('td', {}, [a.nombre]), el('td', { class: 'tabular' }, [a.avg == null ? '—' : String(a.avg)])]);
        var td = el('td', {});
        td.appendChild(semaforo(a.avg));
        row.appendChild(td);
        t.appendChild(row);
      });
      wrap.appendChild(t);

      var detRows = [['Campo', 'N°', 'Reactivo', '% de aciertos del grupo']];
      campos.forEach(function (campo, ci) {
        campo.reactivos.forEach(function (r, qi) {
          var matches = subs.filter(function (s) { return s.respuestas[ci + '_' + qi] === LETTERS[r.correct]; }).length;
          var pct = subs.length ? Math.round((matches / subs.length) * 100) + '%' : '—';
          detRows.push([campo.nombre, String(qi + 1), r.q, pct]);
        });
      });
      var det = el('details');
      det.appendChild(el('summary', {}, ['Detalle por reactivo (% de aciertos) — ' + g + '°']));
      var preId = 'pre_detalle_' + g;
      det.appendChild(el('pre', { class: 'copy', id: preId }, [tsvBlock(detRows)]));
      wrap.appendChild(det);
      det.appendChild(selectAllBtn(preId));

      var rosterRows = [['Nombre', 'Grupo', 'Promedio']].concat(subs.map(function (s, i) {
        return [s.nombre, s.grupo, String(scored[i].promedio)];
      }));
      var det2 = el('details');
      det2.appendChild(el('summary', {}, ['Lista de alumnos capturados — ' + g + '°']));
      var preId2 = 'pre_roster_' + g;
      det2.appendChild(el('pre', { class: 'copy', id: preId2 }, [tsvBlock(rosterRows)]));
      det2.appendChild(selectAllBtn(preId2));
      wrap.appendChild(det2);
    });

    /* --- comparación entre los tres grados --- */
    wrap.appendChild(el('h2', { style: 'margin-top:30px;' }, ['Comparación entre grados']));
    var campoNombres = EXAM['1'].map(function (c) { return c.nombre; });
    var cmpRows = [['Campo formativo', '1°', '2°', '3°']];
    campoNombres.forEach(function (nombre, ci) {
      cmpRows.push([nombre,
        campoAverages['1'][ci].avg == null ? '—' : String(campoAverages['1'][ci].avg),
        campoAverages['2'][ci].avg == null ? '—' : String(campoAverages['2'][ci].avg),
        campoAverages['3'][ci].avg == null ? '—' : String(campoAverages['3'][ci].avg)
      ]);
    });
    var cmpTable = el('table');
    cmpRows.forEach(function (r, i) {
      var tr = el('tr', {});
      r.forEach(function (cell) { tr.appendChild(el(i === 0 ? 'th' : 'td', {}, [cell])); });
      cmpTable.appendChild(tr);
    });
    wrap.appendChild(cmpTable);

    ['1', '2', '3'].forEach(function (g) {
      var avgs = campoAverages[g].filter(function (a) { return a.avg != null; });
      if (!avgs.length) return;
      var min = avgs.reduce(function (a, b) { return b.avg < a.avg ? b : a; });
      wrap.appendChild(el('div', { class: 'sub' }, ['Área a reforzar en ' + g + '°: ' + min.nombre + ' (' + min.avg + ')']));
    });

    var preCmpId = 'pre_cmp';
    wrap.appendChild(el('pre', { class: 'copy', id: preCmpId }, [tsvBlock(cmpRows)]));
    wrap.appendChild(selectAllBtn(preCmpId));

    return wrap;
  }

  /* ---------- arranque ----------
     Prioridad: si quedó un examen sin confirmar guardado en este mismo
     dispositivo (localStorage, sobrevive a cerrar la pestaña o el
     navegador), se reintenta mandarlo antes que cualquier otra cosa —
     nunca se pierde silenciosamente. */
  function boot() {
    var pendingRaw = null;
    try { pendingRaw = localStorage.getItem(pendingKey()); } catch (e) {}
    if (pendingRaw) {
      try {
        var pend = JSON.parse(pendingRaw);
        ui.lastRecord = pend;
        ui.grado = pend.grado;
        ui.screen = 'guardando';
        render();
        enviarRecord(pend, 0);
        return;
      } catch (e) { try { localStorage.removeItem(pendingKey()); } catch (e2) {} }
    }

    var teacherFlag = false;
    try { teacherFlag = sessionStorage.getItem('diag_teacher_v1') === '1'; } catch (e) {}
    if (teacherFlag) {
      ui.screen = 'teacherPanel';
      render();
      cargarResultadosDocente();
      return;
    }

    render();
  }

  boot();
})();
</script>
</body>
</html>
